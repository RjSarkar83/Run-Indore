<script>
"use strict";
/* =====================================================================
   INDORE RUN — the Chrome Dino formula, ArtVision edition
   flat street · one-button jump · duck · escalating speed
   palette journey · neon skyline · skeletal runner · full game-feel
   ===================================================================== */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function hash(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function hexRGB(c){const n=parseInt(c.slice(1),16);return[n>>16,(n>>8)&255,n&255];}
function mix(c1,c2,t){const a=hexRGB(c1),b=hexRGB(c2);return'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')';}
function rgba(c,a){const n=hexRGB(c);return'rgba('+n[0]+','+n[1]+','+n[2]+','+a+')';}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---------- canvas ---------- */
let W=800,H=450,scl=1;
function resize(){
  const w=Math.max(1,window.innerWidth||800),h=Math.max(1,window.innerHeight||450);
  const portrait=h>w*1.15;
  W=portrait?500:800;
  H=clamp(Math.round(W*h/w),portrait?600:340,portrait?1100:620);
  scl=Math.min(w/W,h/H);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*scl*dpr);cv.height=Math.round(H*scl*dpr);
  cv.style.width=Math.round(W*scl)+'px';cv.style.height=Math.round(H*scl)+'px';
  ctx.setTransform(scl*dpr,0,0,scl*dpr,0,0);
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,120));
document.addEventListener('fullscreenchange',()=>setTimeout(resize,60));
resize();
function toggleFS(){try{const d=document,el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen||function(){}).call(d);}
  else{(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);}}catch(e){}setTimeout(resize,80);}
function groundY(){return H*.74;}

/* ---------- audio ---------- */
let AC=null,master,sfxG,musG,noiseBuf,musNext=0,musStep=0;
let soundOn=(store('nr3.snd')!=='0');
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=soundOn?1:0;master.connect(AC.destination);
  sfxG=AC.createGain();sfxG.gain.value=.5;sfxG.connect(master);
  const len=AC.sampleRate;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  /* --- barish/wind ka noise loop HATA diya gaya --- */
  musG=AC.createGain();musG.gain.value=.62;
  const mlp=AC.createBiquadFilter();mlp.type='lowpass';mlp.frequency.value=2700;mlp.Q.value=.5;
  musG.connect(mlp);mlp.connect(master);
  musNext=AC.currentTime+.1;
  setInterval(musicTick,90);
}
function tone(f,dur,type,vol,slide,delay,bus){
  if(!AC)return;const tt=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(Math.max(24,f),tt);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(26,f+slide),tt+dur);
  g.gain.setValueAtTime(vol||.16,tt);g.gain.exponentialRampToValueAtTime(.001,tt+dur);
  o.connect(g);g.connect(bus||sfxG);o.start(tt);o.stop(tt+dur+.06);
}
/* ---------- indian lo-fi kit: sitar-ish pluck, tanpura drone, tabla ---------- */
function pluck(f,dur,vol,delay){
  if(!AC||!musG)return;const tt=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();
  o.type='triangle';
  o.frequency.setValueAtTime(f*1.022,tt);
  o.frequency.exponentialRampToValueAtTime(f,tt+.07);          /* meend — sitar ka girana */
  fl.type='lowpass';fl.frequency.setValueAtTime(2800,tt);
  fl.frequency.exponentialRampToValueAtTime(760,tt+dur);
  g.gain.setValueAtTime(.0001,tt);
  g.gain.linearRampToValueAtTime(vol,tt+.01);
  g.gain.exponentialRampToValueAtTime(.0008,tt+dur);
  o.connect(fl);fl.connect(g);g.connect(musG);o.start(tt);o.stop(tt+dur+.06);
}
function pad(f,dur,vol,delay){
  if(!AC||!musG)return;const tt=AC.currentTime+(delay||0);
  const g=AC.createGain();
  g.gain.setValueAtTime(.0001,tt);
  g.gain.linearRampToValueAtTime(vol,tt+dur*.32);
  g.gain.linearRampToValueAtTime(.0001,tt+dur);
  g.connect(musG);
  const parts=[[1,.5,'triangle'],[1.006,.38,'triangle'],[1.4983,.26,'sine']];  /* root + detune + fifth */
  for(const q of parts){
    const o=AC.createOscillator(),og=AC.createGain();
    o.type=q[2];o.frequency.value=f*q[0];og.gain.value=q[1];
    o.connect(og);og.connect(g);o.start(tt);o.stop(tt+dur+.12);
  }
}
function tabla(kind,delay){
  if(!AC||!musG)return;const tt=AC.currentTime+(delay||0);
  if(kind==='bay'){                       /* bayan — gehri goonj */
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.setValueAtTime(158,tt);
    o.frequency.exponentialRampToValueAtTime(54,tt+.14);
    g.gain.setValueAtTime(.30,tt);g.gain.exponentialRampToValueAtTime(.001,tt+.32);
    o.connect(g);g.connect(musG);o.start(tt);o.stop(tt+.36);
  }else{                                  /* dayan — chusti ki thap */
    const sN=AC.createBufferSource();sN.buffer=noiseBuf;
    const bp=AC.createBiquadFilter();bp.type='bandpass';
    bp.frequency.value=kind==='tek'?1750:1250;bp.Q.value=2.2;
    const g=AC.createGain();
    g.gain.setValueAtTime(kind==='tek'?.13:.17,tt);
    g.gain.exponentialRampToValueAtTime(.001,tt+(kind==='tek'?.07:.11));
    sN.connect(bp);bp.connect(g);g.connect(musG);sN.start(tt);sN.stop(tt+.16);
  }
}
const pv=()=>1+(Math.random()*.14-.07);
const S={
  jump:()=>tone(360*pv(),.17,'sine',.16,240),
  djump:()=>{tone(520*pv(),.12,'sine',.14,430);tone(784*pv(),.16,'sine',.11,320,.05);},
  cut:()=>tone(300,.09,'sine',.06,-120),
  duck:()=>tone(160*pv(),.12,'sine',.1,-40),
  land:()=>tone(140*pv(),.08,'sine',.12,-50),
  step:()=>tone(92*pv(),.035,'sine',.045,-25),
  orb:()=>tone(880*pv(),.1,'sine',.07),
  mile:()=>{tone(1245,.07,'square',.09);tone(1662,.19,'square',.09,0,.08);},
  death:()=>{tone(220,.38,'sawtooth',.2,-160);tone(88,.5,'sine',.22,-36,.04);},
  win:()=>{[523,659,784,1046].forEach((f,i)=>tone(f*pv(),.3,'sine',.12,0,i*.11));},
  ui:()=>tone(660,.06,'sine',.09)
};
/* ---------- indian lo-fi score: har level par naya raag, tempo speed ke saath ---------- */
const RAGAS=[
 {n:'Raag Kafi',     s:[0,2,3,5,7,9,10], r:110},
 {n:'Raag Bhairavi', s:[0,1,4,5,7,8,11], r:110},
 {n:'Raag Yaman',    s:[0,2,4,6,7,9,11], r:110},
 {n:'Raag Bhopali',  s:[0,2,5,7,9],      r:110},
 {n:'Raag Darbari',  s:[0,1,4,5,7,8,10], r:98}
];
const MELS=[
 /* 1 — utarti hui */[[ 7,-1,-1, 5,-1, 4,-1,-1, 3,-1, 4,-1, 5,-1,-1,-1],
  [ 4,-1,-1, 3,-1, 2,-1,-1, 0,-1,-1,-1,-1,-1,-1,-1],
  [ 5,-1, 4,-1, 3,-1, 2,-1, 3,-1,-1, 4,-1,-1,-1,-1],
  [ 2,-1,-1, 3,-1, 4,-1,-1, 5,-1,-1,-1,-1,-1,-1,-1]],
 /* 2 — chadhti hui */[[ 0,-1, 2,-1, 3,-1,-1, 4,-1,-1, 5,-1,-1,-1,-1,-1],
  [ 4,-1, 5,-1, 6,-1,-1, 7,-1,-1,-1, 6,-1,-1,-1,-1],
  [ 5,-1,-1, 6,-1, 7,-1,-1, 8,-1,-1,-1, 7,-1, 6,-1],
  [ 4,-1, 3,-1, 2,-1,-1, 0,-1,-1,-1,-1,-1,-1,-1,-1]],
 /* 3 — chanchal */[[ 7,-1, 6,-1, 5,-1, 6,-1, 7,-1,-1, 5,-1, 4,-1,-1],
  [ 5,-1, 4,-1, 3,-1, 4,-1, 5,-1,-1, 3,-1, 2,-1,-1],
  [ 3,-1, 4,-1, 5,-1, 6,-1, 7,-1,-1, 6,-1, 5,-1,-1],
  [ 4,-1,-1, 2,-1,-1, 0,-1, 2,-1,-1, 4,-1,-1,-1,-1]],
 /* 4 — lambi saansein */[[ 7,-1,-1,-1,-1, 5,-1,-1, 4,-1,-1,-1,-1,-1,-1,-1],
  [ 5,-1,-1,-1,-1, 4,-1,-1, 2,-1,-1,-1,-1,-1,-1,-1],
  [ 4,-1,-1, 5,-1,-1, 6,-1,-1, 7,-1,-1,-1,-1,-1,-1],
  [ 6,-1,-1,-1, 5,-1,-1,-1, 4,-1,-1,-1,-1,-1,-1,-1]]
];
const BARB=[0,0,-2,-4];                           /* bass: I · I · bVII · bVI */
let ragaI=0,melI=0;
const raga=()=>RAGAS[ragaI%RAGAS.length];
const MEL=()=>MELS[melI%MELS.length];
function kf(i){const R=raga(),n=R.s.length,oct=Math.floor(i/n);
  return R.r*Math.pow(2,(R.s[((i%n)+n)%n]+12*oct)/12);}
function ragaFlourish(){                          /* naye level par chhoti si meend */
  if(!AC||!soundOn||!musG)return;
  for(let i=0;i<4;i++)pluck(kf(i+2),.55,.13,i*.085);
}
const BASSP=[0,-1,7,-1,5,-1,3,-1,0,-1,7,10,-1,7,5,3];
function musicTick(){
  if(!AC||!soundOn||!musG)return;
  if(state!=='PLAY'&&state!=='MENU'&&state!=='COUNT')return;
  const bpm=(state==='PLAY')?(64+clamp((spd-300)/640,0,1)*36):60, sd=60/bpm/4;  /* tempo speed ke saath */
  if(musNext<AC.currentTime)musNext=AC.currentTime+.06;
  while(musNext<AC.currentTime+.35){
    const st=musStep%16, bar=Math.floor(musStep/16)%4, d=musNext-AC.currentTime;
    const sw=(st%2)?sd*.14:0;                      /* laid-back swing */
    /* tabla: teentaal-ish theka */
    if(st===0||st===6||st===10)tabla('bay',d+sw);
    if(st===4||st===12)tabla('day',d+sw);
    if(st===14&&bar%2===1)tabla('tek',d+sw);
    if(bar===3&&st===15)tabla('tek',d);
    /* bass */
    if(st===0||st===6||st===10)
      tone(raga().r/2*Math.pow(2,BARB[bar]/12),sd*3.4,'sine',.11,0,d+sw,musG);
    /* tanpura drone — har bar ke shuruwat mein */
    if(st===0)pad(raga().r/2*Math.pow(2,BARB[bar]/12),sd*16,.06,d);
    /* raag ki dhun */
    const m=MEL()[bar][st];
    if(m>=0)pluck(kf(m+5),sd*(st%4===0?3.4:2.4),.135,d+sw);
    musNext+=sd;musStep++;
  }
}

/* ---------- palettes ---------- */
const PAL=[
 {name:'Run-Indore',   sky:['#232447','#6b3d63','#c96f5e'],sun:'#ffddb0',sr:.70,rg0:'#3a2f55',rg1:'#2b2344',city:'#201b3c',gnd:'#191b2e',sil:'#101223',neon:['#ff5c8a','#61e2ff'],orb:'#ffd98a',star:.3},
 {name:'MORNING AZURE',  sky:['#1c2f55','#3a6ea5','#a8d0e8'],sun:'#fff2d0',sr:.30,rg0:'#4a6a94',rg1:'#33507a',city:'#2c4468',gnd:'#232c44',sil:'#182238',neon:['#61e2ff','#7dffa9'],orb:'#ffe9a8',star:0},
 {name:'NOON GOLD',      sky:['#20538c','#5d9bc9','#cfe8ef'],sun:'#fffbe8',sr:.16,rg0:'#5d84a8',rg1:'#46688c',city:'#33527a',gnd:'#27324c',sil:'#1a2740',neon:['#ffd54a','#61e2ff'],orb:'#fff3c0',star:0},
 {name:'AMBER NOON',     sky:['#2a4a7c','#7a8fb8','#f0c98a'],sun:'#fff4d6',sr:.22,rg0:'#6a7aa0',rg1:'#4f5c84',city:'#3c4a74',gnd:'#2b3350',sil:'#1c2440',neon:['#ffb74d','#ff8ac2'],orb:'#ffe27a',star:0},
 {name:'GULAB DUSK',     sky:['#33265c','#a04a6e','#ff9a5c'],sun:'#ffd9a8',sr:.58,rg0:'#5c3a68',rg1:'#452c55',city:'#3a2650',gnd:'#241b38',sil:'#181229',neon:['#ff9d6b','#b39dff'],orb:'#ffcf8a',star:.15},
 {name:'SARAFA NEON',    sky:['#1c1638','#5c2a5e','#c9486b'],sun:'#ff9db8',sr:.64,rg0:'#472556',rg1:'#351c44',city:'#2c1a40',gnd:'#1e152e',sil:'#130c20',neon:['#ff2d78','#00e5ff'],orb:'#ff8ac2',star:.35},
 {name:'EVENING INDIGO', sky:['#141a3d','#2c2a5e','#6b3a6e'],sun:'#c9b8e8',sr:.68,rg0:'#2c2650',rg1:'#221e40',city:'#1c1a38',gnd:'#151729',sil:'#0e0c1f',neon:['#b39dff','#61e2ff'],orb:'#b39dff',star:.55},
 {name:'NIGHT LAMPS',    sky:['#0c0f28','#1a1c42','#33305e'],sun:'#e8ecff',sr:.72,rg0:'#232448',rg1:'#1a1c3a',city:'#151731',gnd:'#101223',sil:'#0a0b1c',neon:['#61e2ff','#7dffa9'],orb:'#9fd8ff',star:.8},
 {name:'MOONHIGH',       sky:['#090b1f','#131535','#262852'],sun:'#f0f4ff',sr:.76,rg0:'#1d1f40',rg1:'#151731',city:'#101226',gnd:'#0d0f20',sil:'#08091a',neon:['#9fd8ff','#ff5c8a'],orb:'#c9e2ff',star:.9},
 {name:'ARTViSiON SKY',  sky:['#0d0a24','#3c1a5c','#e040fb'],sun:'#ffd6ff',sr:.60,rg0:'#2c1650',rg1:'#221340',city:'#1c1033',gnd:'#130c22',sil:'#0d0819',neon:['#e040fb','#00e5ff'],orb:'#61e2ff',star:.7}
];
function pal(){
  const a=PAL[palA],b=PAL[palB],t=palT;
  return{sky0:mix(a.sky[0],b.sky[0],t),sky1:mix(a.sky[1],b.sky[1],t),sky2:mix(a.sky[2],b.sky[2],t),
    sun:mix(a.sun,b.sun,t),sr:lerp(a.sr,b.sr,t),
    rg0:mix(a.rg0,b.rg0,t),rg1:mix(a.rg1,b.rg1,t),city:mix(a.city,b.city,t),
    gnd:mix(a.gnd,b.gnd,t),sil:mix(a.sil,b.sil,t),
    n0:mix(a.neon[0],b.neon[0],t),n1:mix(a.neon[1],b.neon[1],t),
    orb:mix(a.orb,b.orb,t),star:lerp(a.star,b.star,t)};
}
let palA=0,palB=1,palT=0,palIdx=0;

/* ---------- state ---------- */
let state='MENU';
let P=null,obs=[],parts=[],pops=[],marks=[];
let spd=360,distW=0,score=0,hi=parseInt(store('nr3.hi')||'0',10)||0;
let nextSpawn=700,mileNext=100,shakeMag=0,shakeDir=0,shakeT=0,hitStop=0,flashA=0;
let deathT=0,tGlob=0,newHi=false,duckHeld=false,jumpHeld=false,startCd=0;
let overN=parseInt(store('nr3.ovn')||'0',10)||0,redOver=false;   /* har dusri game over laal */
let lvlT=0,lvlN=1;   /* LEVEL UP banner timer + level number */
const keys={};
const btns=[];
function pop(t,c,size){pops.push({t:t,c:c,life:1.3,tl:1.3,s:size||14,y:0});}
function addP(x,y,vx,vy,life,size,c,type,drag){
  if(parts.length>260)parts.shift();
  parts.push({x:x,y:y,vx:vx,vy:vy,life:life,tl:life,size:size,c:c,type:type||'dot',drag:drag===undefined?1:drag,rot:rnd(0,TAU),vr:rnd(-6,6)});
}
function shakeIt(mag,dir){shakeMag=Math.max(shakeMag,mag);shakeDir=dir||0;shakeT=.15;}
function hitStopF(t){hitStop=Math.max(hitStop,t);}

/* ---------- run ---------- */
function toMenu(){
  obs=[];parts=[];pops=[];
  P={duck:false,vy:0,air:false,dj:false,flip:0,jumpCut:false,ph:0,sqx:1,sqy:1,stepT:0,rollT:0,dead:false,dvy:0,drot:0,coyote:0,buf:0,y:0};
  P.y=groundY();
  palA=0;palB=1;palT=0;palIdx=0;
  shakeMag=0;flashA=0;hitStop=0;deathT=0;newHi=false;duckHeld=false;jumpHeld=false;lvlT=0;
  state='MENU';
}
function resetRun(){
  obs=[];parts=[];pops=[];marks=[];
  P={duck:false,vy:0,air:false,dj:false,flip:0,jumpCut:false,ph:0,sqx:1,sqy:1,stepT:0,rollT:0,dead:false,dvy:0,drot:0,coyote:0,buf:0};
  P.y=groundY();                       /* safety: P.y hamesha defined */
  spd=300;distW=0;score=0;mileNext=100;nextSpawn=620;
  shakeMag=0;hitStop=0;flashA=0;deathT=0;newHi=false;startCd=.5;lvlT=0;
  palA=0;palB=1;palT=0;palIdx=0;
  state='PLAY';
}
function curSpeed(){
  /* LEVEL 1 (0-200) friendly: 300 -> 370. Uske baad har level ke saath tez. */
  if(score<200)return 300+score*.35;
  const lv=Math.floor(score/200);
  return Math.min(900,370+(score-200)*.10+(lv-1)*30);
}
function spawnObstacle(){
  const px=nextSpawn;
  const r=hash(px*.77+Math.floor(px)*.13);
  const easy=score<200;                  /* LEVEL 1 = easy street */
  if(!easy&&r<.22){
    /* pigeon — from LEVEL 2 onward, three lanes like dino pterodactyls */
    const lane=pick([0,1,2]);
    const yOff=lane===0?22:lane===1?46:86;
    obs.push({t:'bird',x:W+80,yOff:yOff,w:46,h:22,ph:rnd(0,TAU),vx:rnd(50,120)});
  }else if(r<.44){
    /* neon sign stand — shorter while the run is easy */
    const hh=easy?(38+hash(px)*10):(50+hash(px)*18);
    obs.push({t:'sign',x:W+80,yOff:0,w:26,h:hh,ph:rnd(0,TAU),vx:0,
      txt:pick(['OPEN','24\u00d77','AV','56','CAFE','Wi-Fi','ART']),flk:0,c:pal().n0});
  }else if(r<.66){
    /* AC block with hazard chevron */
    obs.push({t:'ac',x:W+80,yOff:0,w:(easy?40:44)+hash(px*3)*(easy?14:18),h:(easy?32:38),vx:0});
  }else{
    /* ink barrel cluster — max 2 while easy, up to 4 later */
    const n=easy?(1+Math.floor(hash(px*5.1)*1.4))
               :(1+Math.floor(hash(px*5.1)*(1.3+Math.min(1.6,(score-200)/900))));
    const bw=26;
    const li=Math.floor(hash(px*2.9)*4);
    for(let i=0;i<n;i++)obs.push({t:'barrel',x:W+80+i*(bw+3),yOff:0,w:bw,h:40,vx:0,li:li});
  }
  const timeGap=easy?rnd(.95,1.35)
                    :(rnd(.95,1.35)-Math.min(.33,(score-200)/2200));   /* dhire-dhire tight */
  nextSpawn=px+Math.max(240,spd*timeGap)+(easy?300:230);
}
function update(dt){
  if(state==='COUNT'){startCd-=dt;if(startCd<=0)state='PLAY';return;}
  if(state==='WIN'||state==='DEAD'){
    deathT+=dt;
    if(P.dead){P.dvy+=1500*dt;P.y+=P.dvy*dt;P.drot+=4.5*dt;}
    stepFx(dt);
    shakeT-=dt;if(shakeT<=0)shakeMag*=Math.exp(-dt*9);
    return;
  }
  /* ------ PLAY ------ */
  spd=curSpeed();
  const dx=spd*dt;
  distW+=dx;
  score+=dx*.022;
  /* palette journey every 300 score */
  const lv=levelNum();
  const pi=(lv-1)%PAL.length;                 /* palette cycles, level keeps climbing */
  if(pi!==palIdx){ragaI=(lv-1)%RAGAS.length;melI=(lv-1)%MELS.length;ragaFlourish();
    palIdx=pi;palA=palB;palB=pi;palT=0;
    pop('LEVEL '+lv+' \u00b7 '+PAL[pi].name,'#ffe9a8',14);flashA=.3;S.mile();
    /* only celebrate from LEVEL 2 upward */
    if(lv>1){lvlT=1.7;lvlN=lv;S.mile();
      for(let i=0;i<26;i++)addP(rnd(W*.2,W*.8),H*.26+rnd(-14,14),
        rnd(-150,150),rnd(-210,-60),rnd(.7,1.3),rnd(2.5,5),
        pick(['#ffe9a8','#ffffff',pal().n0,pal().n1]),'confetti',.985);}
  }
  palT=Math.min(1,palT+dt*1.2);
  if(lvlT>0)lvlT-=dt;
  /* milestones every 100 */
  if(score>=mileNext){mileNext+=100;S.mile();flashA=.22;pop(mileNext-100+' m','#ffe9a8',15);}
  /* player physics */
  const g0=groundY();
  if(!P.air){
    P.y=g0;
  }else{
    let g=2050;
    if(Math.abs(P.vy)<120)g*=.55;
    else if(P.vy>0)g*=1.32;
    if(!jumpHeld&&P.vy<-260)g+=2300;
    P.vy+=g*dt;P.y+=P.vy*dt;
    if(P.y>=g0){
      P.y=g0;P.air=false;P.vy=0;P.dj=false;P.flip=0;
      const imp=clamp(P.sqy-1+.3,.3,1);
      P.sqx=1+.2*imp;P.sqy=1-.24*imp;
      hitStopF(.028);shakeIt(1.4+imp*2,1);S.land();
      for(let i=0;i<7;i++)addP(W*.22+rnd(-10,10),g0,rnd(-70,20),rnd(-60,-6),.4,rnd(2,4),'rgba(255,255,255,.3)','dot',.92);
    }
  }
  if(P.flip>0)P.flip=Math.max(0,P.flip-dt*1.9);
  P.sqx+=(1-P.sqx)*Math.min(1,dt*12);
  P.sqy+=(1-P.sqy)*Math.min(1,dt*12);
  P.ph+=P.air?dt*2:spd*dt*.055;
  /* duck */
  const wantDuck=(keys.ArrowDown||keys.KeyS||duckHeld)&&P.air===false;
  if(wantDuck&&!P.duck){P.duck=true;S.duck();
    for(let i=0;i<5;i++)addP(W*.2,g0-2,rnd(-70,-20),rnd(-40,-4),.4,rnd(2,3.5),'rgba(255,255,255,.25)','dot',.93);}
  else if(!wantDuck&&P.duck){P.duck=false;}
  /* run dust + steps */
  /* no foot pushing any more — bas wheel ki dhool */
  if(!P.air&&!P.duck){
    P.rollT=(P.rollT||0)+dt;
    if(P.rollT>.42){P.rollT=0;
      addP(W*.2,g0-2,rnd(-46,-12),rnd(-14,-2),.3,rnd(1,2.2),'rgba(255,255,255,.13)','dot',.93);}
  }
  /* spawn */
  nextSpawn-=dx;
  if(nextSpawn<=0)spawnObstacle();
  /* move world */
  for(const o of obs)o.x-=(spd+(o.vx||0))*dt;
  while(obs.length&&obs[0].x<-120)obs.shift();
  /* collision — forgiving insets */
  const pxx=W*.22;
  const ph2=P.duck?26:48;
  const pt=P.y-ph2+5,pb=P.y-3,pl2=pxx-12,pr2=pxx+16;  /* hugs the scooter deck */
  for(const o of obs){
    const oy0=g0-o.yOff-(o.t==='bird'?0:o.h);
    let ox=o.x+3,ow=o.w-6,ot=oy0+3,ob=g0-2;
    if(o.t==='bird'){ot=oy0-12;ob=oy0+6;}   /* box now matches the drawn pigeon */
    else{ot=oy0+3;}
    if(pl2<ox+ow&&pr2>ox&&pt<ob&&pb>ot){
      die();return;
    }
  }
  stepFx(dt);
  shakeT-=dt;if(shakeT<=0)shakeMag*=Math.exp(-dt*9);
  flashA=Math.max(0,flashA-dt*2.2);
}
function die(){
  P.dead=true;P.dvy=-540;P.drot=0;deathT=0;P.flip=0;
  hitStopF(.2);shakeIt(6,-1);flashA=.55;S.death();
  try{navigator.vibrate&&navigator.vibrate([90,40,110]);}catch(e){}
  state='DEAD';
  overN++;redOver=(overN%2===0);store('nr3.ovn',String(overN));   /* ek baar laal, ek baar gulabi */
  if(score>hi){hi=Math.floor(score);store('nr3.hi',String(hi));newHi=true;}
  for(let i=0;i<22;i++){const a=rnd(0,TAU);
    addP(W*.22,P.y-24,Math.cos(a)*rnd(60,260),Math.sin(a)*rnd(60,260)-60,rnd(.4,.9),rnd(2,5),pick(['#fff','#ffd98a','#9fd8ff']),'spark',.96);}
}
function stepFx(dt){
  for(let i=parts.length-1;i>=0;i--){const f=parts[i];
    f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=Math.pow(f.drag,dt*60);f.vy*=Math.pow(f.drag,dt*60);
    if(f.type==='confetti'){f.vy=Math.min(80,f.vy+24*dt);f.rot+=f.vr*dt;}
    f.life-=dt;if(f.life<=0)parts.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.life-=dt;if(p.life<=0)pops.splice(i,1);}
}
function doJump(){

    P.sqx=.82;P.sqy=1.22;

  }
}

/* ---------- side bag (ArtViSiON sling) — laptop hata diya gaya ---------- */
function drawZip(x0,zy,x1){        /* asli chain: tape + daant + slider + kheechne wala kaan */
  const len=x1-x0, n=Math.max(4,Math.round(len/1.15)), pt=len/n;

  g.addColorStop(0,'#e8eefb');g.addColorStop(.45,'#a3afc6');g.addColorStop(1,'#5a6482');
  ctx.fillStyle=g;
  for(let i=0;i<n;i++){                                                      /* upar-neeche ke daant */
    const tx=x0+i*pt;
    ctx.fillRect(tx,zy-1.2,pt*.60,1.15);
    if(tx+pt*.5+pt*.60<=x1+.25)ctx.fillRect(tx+pt*.5,zy+.05,pt*.60,1.15);
  }
  ctx.fillStyle='rgba(8,11,22,.5)';ctx.fillRect(x0,zy-.16,len,.32);          /* daanton ki beech ki lakeer */
  const sx=x1-2.1;                                                           /* slider */
  ctx.fillStyle='#c6d0e3';rr(sx-1.5,zy-1.75,3.0,3.5,1.0);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(sx-1.1,zy-1.35,2.2,.75);
  ctx.strokeStyle='rgba(8,11,22,.65)';ctx.lineWidth=.7;rr(sx-1.5,zy-1.75,3.0,3.5,1.0);ctx.stroke();
  ctx.strokeStyle='#8f9bb5';ctx.lineWidth=.9;ctx.lineCap='round';             /* puller */
  ctx.beginPath();ctx.moveTo(sx,zy+1.6);ctx.lineTo(sx+1.5,zy+3.3);ctx.stroke();
  ctx.fillStyle='#b9c4da';rr(sx+.9,zy+2.9,3.1,1.5,.75);ctx.fill();
  ctx.fillStyle='rgba(8,11,22,.35)';rr(sx+1.5,zy+3.25,1.7,.8,.4);ctx.fill();
}

/* ---------- push scooter (ArtViSiON edition) ---------- */
function scWheel(x,y,r,spin){
  const p=pal();
  ctx.fillStyle='#0b0e1c';
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.20)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x,y,r-1,0,TAU);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.13)';ctx.lineWidth=1;
  for(let i=0;i<4;i++){const a=spin+i*PI/4;
    ctx.beginPath();
    ctx.moveTo(x+Math.cos(a)*(r-2.6),y+Math.sin(a)*(r-2.6));
    ctx.lineTo(x-Math.cos(a)*(r-2.6),y-Math.sin(a)*(r-2.6));
    ctx.stroke();}
  ctx.fillStyle=p.n1;ctx.globalAlpha=.9;
  ctx.beginPath();ctx.arc(x,y,2.1,0,TAU);ctx.fill();
  ctx.globalAlpha=1;
}

/* ---------- skeletal rider on the push scooter ---------- */
function limb(ox,oy,tx,ty,l1,l2,flip){
  const dx=tx-ox,dy=ty-oy;
  let d=Math.hypot(dx,dy);d=clamp(d,Math.abs(l1-l2)+.5,l1+l2-.5);
  const a=Math.atan2(dy,dx);
  const cos1=(l1*l1+d*d-l2*l2)/(2*l1*d);
  const a1=a-Math.acos(clamp(cos1,-1,1))*flip;
  const kx=ox+Math.cos(a1)*l1,ky=oy+Math.sin(a1)*l1;
  ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(kx,ky);ctx.lineTo(tx,ty);ctx.stroke();
}
function fist(col,x,y,ang){          /* handle ko pakdi hui mutthi */

  ctx.fillStyle=col;
  rr(-4.6,-3.6,9.2,7.2,3.4);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.13)';ctx.lineWidth=1;
  for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*2.8,-3.1);ctx.lineTo(i*2.8,3.1);ctx.stroke();}
  ctx.fillStyle='rgba(255,255,255,.07)';
  rr(-3.4,-3.2,6.8,2.4,1.6);ctx.fill();
  ctx.restore();
}
function drawRunner(){
  const p=pal();

  ctx.save();
  ctx.translate(px,y);
  ctx.scale(P.sqx,P.sqy);
  if(P.dead){

    ctx.beginPath();ctx.arc(4,-30,7.2,0,TAU);ctx.fill();

    const bfx=lerp(-8,-15,spread),bfy=lerp(-8,-13,spread); /* back foot kicks back */

    ctx.globalAlpha=.65;limb(-1,hipY,bfx,bfy,15,15,1);ctx.globalAlpha=1;

    /* torso + head + side bag */
    ctx.fillStyle=COL;
    ctx.save();ctx.translate(0,hipY);ctx.rotate(-.06);

    ctx.beginPath();ctx.arc(2,-32,7.5,0,TAU);ctx.fill();
    ctx.fillRect(3,-36,12,3.5);
    drawBag(Math.sin(P.ph)*.05);
    ctx.restore();
    /* dono haath scooter ke handle par — kohni neeche, mutthi grip par */
    const g1=gp(15,-35.5),g2=gp(24,-35.5);
    ctx.strokeStyle=COL;ctx.lineWidth=5;ctx.globalAlpha=.6;
    limb(1,hipY-21,g1[0],g1[1],16,16,-1);ctx.globalAlpha=1;
    fist(COL,g1[0],g1[1],.5);
    ctx.strokeStyle=COL;ctx.lineWidth=5.5;
    limb(2,hipY-19,g2[0],g2[1],16,16,-1);

/* ---------- pahad se girta paani (waterfall) ---------- */
function drawWater(x,y0,h,w,a){

  ctx.lineCap='round';
  for(let i=0;i<6;i++){
    const sx=x-w/2+((i+.5)*w/6)+Math.sin(tGlob*1.5+i*2.1+x*.05)*1.3;
    const len=13+((i*7)%15);
    const off=((tGlob*(56+(i%3)*28)+i*43)%(h+len))-len;
    ctx.globalAlpha=(.34*a)*(.55+.45*Math.sin(tGlob*3.1+i));
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1+(i%2?.7:0);
    ctx.beginPath();ctx.moveTo(sx,y0+off);ctx.lineTo(sx,y0+off+len);ctx.stroke();
  }

}
/* ---------- ped, paudhe, gaay, bakri ---------- */
function drawTree(x,y,sc,dir,al){

function naturePool(){
  const lv=levelNum();
  const pl=['tree','tree','tree','bush','bush','bush','cow','cow','goat','goat'];
  if(lv>=2)pl.push('peacock','peacock','peacock');   /* LV2 se mor */
  if(lv>=3)pl.push('dog','dog','dog');               /* LV3 se kutta */
  if(lv>=4)pl.push('elephant','elephant');           /* LV4 se hathi */
  if(lv>=5)pl.push('lion','lion');                   /* LV5 se sher */
  return pl;
}
function drawNature(off,sc,seed){
  const per=250,o=distW*off;
  const base=Math.floor(o/per),frac=o/per-base;
  const kMax=Math.ceil(W/per)+2;
  for(let k=-1;k<=kMax;k++){
    const idx=base+k;
    const sx=k*per-frac*per+dh(idx,seed)*70;
    if(sx<-90||sx>W+90)continue;
    const pool=naturePool();
    const pick=pool[Math.min(pool.length-1,Math.floor(dh(idx,seed+101)*pool.length))];
    const v=dh(idx,seed+7), al=sc<1?.72:.95, ph=dh(idx,seed+23)*6;
    if(pick==='tree')drawTree(sx,groundY()+6,sc*(1.15+v*.70),(dh(idx,seed+9)>.5?1:-1),al);
    else if(pick==='bush')drawBush(sx,groundY()+6,sc*(.85+dh(idx,seed+11)*.5),al);
    else if(pick==='cow')drawCow(sx,groundY()+8,sc*(1.05+v*.25),ph,al);
    else if(pick==='goat')drawGoat(sx,groundY()+8,sc*(.95+v*.30),ph,al);
    else if(pick==='peacock')drawPeacock(sx,groundY()+7,sc*(.95+v*.30),ph,al);
    else if(pick==='dog')drawDog(sx,groundY()+7,sc*(.90+v*.30),ph,al);
    else if(pick==='elephant')drawElephant(sx,groundY()+9,sc*(1.05+v*.30),ph,al);
    else drawLion(sx,groundY()+8,sc*(.95+v*.25),ph,al);
  }
}

function wrapI(i,m){return ((i%m)+m)%m;}
/* uniform hash for scenery slots */
function dh(a,b){let h=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263))>>>0;
  h=(h^(h>>>13))>>>0;h=Math.imul(h,1274126177)>>>0;return ((h^(h>>>16))>>>0)/4294967296;}
function drawRidge(off,col,amp,base,per,yb,wf){
  /* vertices are world-locked and slide LEFT — background runs with the player */
  const o=distW*off;
  const k0=Math.floor(o/per)-2,k1=k0+Math.ceil(W/per)+5;
  const HH=[],XX=[];
  for(let k=k0;k<=k1;k++){
    const wx=k*per,ii=wrapI(k,911);
    HH.push(base+hash(ii*1.1)*amp+Math.sin(wx*.0031+ii)*amp*.25);
    XX.push(wx-o);
  }
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(XX[0],yb+90);
  for(let i=0;i<HH.length;i++)ctx.lineTo(XX[i],yb-HH[i]);
  ctx.lineTo(XX[XX.length-1],yb+90);
  ctx.closePath();ctx.fill();
  /* pahad ki choti se girta hua paani — waterfall */
  if(wf)for(let i=1;i<HH.length-1;i++){
    const k=k0+i,ii=wrapI(k,911);
    if(HH[i]>HH[i-1]&&HH[i]>=HH[i+1]&&hash(ii*4.3)>.72)
      drawWater(XX[i],yb-HH[i]+3,(40+hash(ii*6.1)*130)*wf,(5+hash(ii*8.7)*7)*wf,wf);
  }
}

  ctx.shadowColor=col;ctx.shadowBlur=10;

function drawCity(off,col,yb,per){
  const p=pal();
  const o=distW*off;
  const M=577,NM=CITY_NAMES.length;
  const NMGAP=Math.max(3,Math.ceil((W+170)/per)),NMOFF=Math.floor(NMGAP/2);
  const base=Math.floor(o/per),frac=o/per-base;
  const kMax=Math.ceil(W/per)+2;
  for(let k=-1;k<=kMax;k++){
    const idx=base+k;
    const sx=k*per-frac*per;            /* screen x slides LEFT as the run advances */
    const ii=wrapI(idx,M);
    const bw2=per*.72,bx=sx,bh=34+hash(ii*1.7)*95;
    if(bx>W+10||bx+bw2<-10)continue;
    ctx.fillStyle=col;
    ctx.fillRect(bx,yb-bh,bw2,bh+34);
    if(hash(ii*3.3)>.5){
      ctx.fillStyle='rgba(255,220,150,.1)';
      for(let wy=yb-bh+7;wy<yb-8;wy+=13)if(hash(ii*13+wy)>.55)ctx.fillRect(bx+6,wy,4,5);
    }
    /* neon landmark box — sirf har 6th building par (ek naam screen se nikle, phir agla aaye) */
    if(wrapI(idx-NMOFF,NMGAP)===0){
      const nm=CITY_NAMES[wrapI(Math.floor((idx-NMOFF)/NMGAP),NM)];
      const nc=wrapI(idx,2)?p.n0:p.n1;
      const flick=(hash(ii*7.7)>.86)?(.55+.45*Math.abs(Math.sin(tGlob*11+idx))):1;
      const bwid=drawNeonName(bx+bw2/2,yb-bh-21,nm,nc,flick);
      /* wet-street reflection smear */
      const ry=groundY();
      const nc2=hexRGB(nc);
      const rg=ctx.createLinearGradient(0,ry,0,ry+26);
      rg.addColorStop(0,'rgba('+nc2[0]+','+nc2[1]+','+nc2[2]+','+(0.14*flick)+')');
      rg.addColorStop(1,'rgba('+nc2[0]+','+nc2[1]+','+nc2[2]+',0)');
      ctx.fillStyle=rg;
      ctx.fillRect(bx+bw2/2-bwid/2,ry,bwid,26);
    }
  }
}

      const cx2=o.x+o.w/2;
      const bw=o.w+26, bh=24, bx=cx2-bw/2, by=top-6;
      /* flicker */
      o.flk=(o.flk||0)+.016;
      const flick=(hash(o.x)>.75)?(.55+.45*Math.abs(Math.sin(tGlob*13+o.ph))):1;
      /* legs */
      ctx.strokeStyle=rgba(p.sil,1);ctx.lineWidth=4;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(cx2-8,base);ctx.lineTo(cx2-3,by+bh-2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx2+8,base);ctx.lineTo(cx2+3,by+bh-2);ctx.stroke();

      ctx.fillStyle='#0b0d18';
      rr(bx,by,bw,bh,5);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;ctx.stroke();
      /* neon border + text */
      ctx.save();
      ctx.globalAlpha=flick;
      ctx.shadowColor=o.c;ctx.shadowBlur=9;
      ctx.strokeStyle=o.c;ctx.lineWidth=1.5;
      rr(bx+2.5,by+2.5,bw-5,bh-5,4);ctx.stroke();
      ctx.fillStyle=o.c;
      ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(o.txt,cx2,by+bh/2+.5);
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,255,255,.7)';
      ctx.font='900 10px system-ui';
      ctx.fillText(o.txt,cx2,by+bh/2+.5);
      ctx.restore();
      /* ground glow smear */
      const rg=ctx.createLinearGradient(0,base,0,base+18);
      const nc=hexRGB(o.c);
      rg.addColorStop(0,'rgba('+nc[0]+','+nc[1]+','+nc[2]+','+(0.16*flick)+')');
      rg.addColorStop(1,'rgba('+nc[0]+','+nc[1]+','+nc[2]+',0)');
      ctx.fillStyle=rg;ctx.fillRect(bx,base,bw,18);
    }else if(o.t==='ac'){
      /* ---- premium AC condenser unit ---- */
      const base=g0-o.yOff;
      const bx=o.x,bw=o.w,bh=o.h;
      /* body */
      ctx.fillStyle=rgba(p.sil,.98);
      rr(bx,base-bh,bw,bh,5);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.stroke();
      /* top hazard strip */
      ctx.save();
      ctx.beginPath();rr(bx+3,base-bh+3,bw-6,7,2);ctx.clip();
      ctx.fillStyle='rgba(255,217,138,.65)';
      for(let hx=bx-2;hx<bx+bw+4;hx+=9){
        ctx.beginPath();ctx.moveTo(hx,base-bh+10);ctx.lineTo(hx+5,base-bh+3);ctx.lineTo(hx+8,base-bh+3);ctx.lineTo(hx+3,base-bh+10);ctx.closePath();ctx.fill();
      }
      ctx.restore();
      /* fan grill (concentric) */
      const fx2=bx+bw*.36,fy2=base-bh*.46,fr=Math.min(11,bh*.3);
      ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.2;
      for(let cr=3;cr<=fr;cr+=3.5){
        ctx.beginPath();ctx.arc(fx2,fy2,cr,0,TAU);ctx.stroke();
      }
      ctx.fillStyle='rgba(255,255,255,.5)';
      ctx.beginPath();ctx.arc(fx2,fy2,1.8,0,TAU);ctx.fill();
      /* side vents */
      ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1.4;
      for(let vy=base-bh+14;vy<base-6;vy+=6){
        ctx.beginPath();ctx.moveTo(bx+bw-11,vy);ctx.lineTo(bx+bw-4,vy);ctx.stroke();
      }
      /* status LED */
      const led=(hash(o.x)>.5)?'rgba(125,255,169,.9)':'rgba(255,138,194,.9)';
      ctx.fillStyle=led;
      ctx.beginPath();ctx.arc(bx+7,base-6,2,0,TAU);ctx.fill();
      /* rubber feet */
      ctx.fillStyle='rgba(0,0,0,.4)';
      ctx.fillRect(bx+2,base-2,7,2);ctx.fillRect(bx+bw-9,base-2,7,2);
    }else if(o.t==='barrel'){
      /* ---- premium CMYK ink barrel ---- */
      const base=g0-o.yOff;
      const bx=o.x,bw=o.w,bh=o.h;
      const inkC=['#00e5ff','#ff00d0','#ffe600','#f4f6f8'][o.li||0];
      /* body with vertical gradient */
      const bg=ctx.createLinearGradient(bx,0,bx+bw,0);
      bg.addColorStop(0,rgba(p.sil,1));
      bg.addColorStop(.35,'rgba(255,255,255,.14)');
      bg.addColorStop(.5,rgba(p.sil,.92));
      bg.addColorStop(1,rgba(p.sil,1));
      ctx.fillStyle=bg;
      rr(bx,base-bh,bw,bh,5);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1;ctx.stroke();
      /* rim rings */
      ctx.fillStyle='rgba(255,255,255,.16)';
      ctx.fillRect(bx+1,base-bh+5,bw-2,2.5);
      ctx.fillRect(bx+1,base-9,bw-2,2.5);
      /* color band */
      ctx.fillStyle=inkC;
      rr(bx+2,base-bh+10,bw-4,9,2);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.35)';
      ctx.font='900 7px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(['CYAN','MAGE','YEL','BLK'][o.li||0],bx+bw/2,base-bh+15);
      /* big letter */
      ctx.fillStyle='rgba(255,255,255,.92)';
      ctx.font='900 13px system-ui';
      ctx.fillText(['C','M','Y','K'][o.li||0],bx+bw/2,base-bh/2+3);
      ctx.textBaseline='alphabetic';
      /* lid */
      ctx.fillStyle=rgba(p.sil,1);
      rr(bx-1.5,base-bh-3,bw+3,5,2);ctx.fill();
      ctx.fillStyle=inkC;
      ctx.globalAlpha=.5;
      ctx.fillRect(bx+2,base-bh-1.5,bw-4,1.5);
      ctx.globalAlpha=1;
    }else if(o.t==='bird'){
      /* ---- premium pigeon ---- */
      const base=g0-o.yOff;
      const bob=Math.sin(tGlob*3+o.ph)*2;
      const fl=Math.sin(tGlob*11+o.ph)*5;
      const bx=o.x,by=base-6+bob;
      ctx.fillStyle=rgba(p.sil,.98);
      /* tail */
      ctx.beginPath();ctx.moveTo(bx+34,by-3);ctx.lineTo(bx+46,by-6);ctx.lineTo(bx+46,by);ctx.lineTo(bx+34,by+1);ctx.closePath();ctx.fill();

      ctx.beginPath();ctx.ellipse(bx+20,by,11,5.5,-.08,0,TAU);ctx.fill();
      /* head */
      ctx.beginPath();ctx.arc(bx+9,by-4,4,0,TAU);ctx.fill();
      /* beak */
      ctx.fillStyle='rgba(255,217,138,.8)';
      ctx.beginPath();ctx.moveTo(bx+5,by-4);ctx.lineTo(bx+0,by-3);ctx.lineTo(bx+5,by-2);ctx.closePath();ctx.fill();
      /* wing flapping */
      ctx.fillStyle=rgba(p.sil,.98);
      ctx.beginPath();ctx.moveTo(bx+22,by-3);
      ctx.quadraticCurveTo(bx+12,by-9-fl,bx+2,by-6-fl*.5);
      ctx.quadraticCurveTo(bx+13,by+1,bx+22,by-3);ctx.fill();
      /* eye */
      ctx.fillStyle='rgba(255,255,255,.7)';
      ctx.beginPath();ctx.arc(bx+8,by-5,1.4,0,TAU);ctx.fill();
      ctx.fillStyle='#0a0b14';
      ctx.beginPath();ctx.arc(bx+8,by-5,.7,0,TAU);ctx.fill();
    }

}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  const rdt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;tGlob+=rdt;
  let dt=rdt;
  if(hitStop>0){hitStop-=rdt;dt=0;}
  if(state==='PLAY'||state==='COUNT')update(dt);
  else if(state==='DEAD')update(Math.min(dt,rdt));
  else if(state==='MENU'){
    distW+=140*rdt; /* slow scenic scroll */
    if(P){P.ph+=140*rdt*.055;P.y=groundY();}
    stepFx(rdt);
  }
  draw();
  requestAnimationFrame(loop);
}

/* ---------- input ---------- */
const isTouch=('ontouchstart'in window)||(navigator.maxTouchPoints>0);
let ptrId=null;
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();initAudio();
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)/scl,y=(e.clientY-r.top)/scl;
  for(const b of btns)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return;}
  if(state==='MENU'){resetRun();return;}
  if(state==='DEAD'){if(deathT>.9)resetRun();return;}
  if(state==='PAUSE'){state='PLAY';return;}
  if(state==='PLAY'){
    /* left 30% = duck, rest = jump (mobile) */
    if(isTouch&&x<W*.3){duckHeld=true;ptrId=e.pointerId;}
    else{jumpHeld=true;doJump();}
  }
});
function ptrEnd(e){
  if(ptrId===e.pointerId){duckHeld=false;ptrId=null;}
  jumpHeld=false;
}
addEventListener('pointerup',ptrEnd);addEventListener('pointercancel',ptrEnd);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',function(e){
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;initAudio();
  if(e.repeat)return;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
    if(state==='MENU')resetRun();
    else if(state==='PLAY'){jumpHeld=true;doJump();}
    else if(state==='DEAD'&&deathT>.9)resetRun();
  }
  if(e.code==='KeyM')toggleSound();
  if(e.code==='KeyF')toggleFS();
  if(e.code==='KeyR'&&(state==='PLAY'||state==='DEAD'||state==='PAUSE'))resetRun();
  if(e.code==='KeyP'||e.code==='Escape'){
    if(state==='PLAY')state='PAUSE';
    else if(state==='PAUSE')state='PLAY';
    else if(state==='DEAD'&&deathT>.9)toMenu();
  }
});
addEventListener('keyup',function(e){
  keys[e.code]=false;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jumpHeld=false;
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='PLAY')state='PAUSE';});
